# ══════════════════════════════════════════════════════════════
# ai.daxiazhaoguang.com → Open WebUI (127.0.0.1:8690)
# 由 deploy/deploy.sh 安装到 /etc/nginx/conf.d/ 并 reload
# HTTPS 由 certbot --nginx 自动改写本文件
# ══════════════════════════════════════════════════════════════
server {
    listen 80;
    listen [::]:80;
    server_name ai.daxiazhaoguang.com;

    # 允许上传文档/图片（Open WebUI 的知识库与附件）
    client_max_body_size 200M;

    location / {
        proxy_pass http://127.0.0.1:8690;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket + SSE 流式输出（对话逐字返回）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
